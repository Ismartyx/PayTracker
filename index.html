      --text: #e5e7eb; --muted: #94a3b8; --accent: #38bdf8; --good: #22c55e; 
      --warn: #f59e0b; --bad: #ef4444; --chip: #1e293b;
      --fz: 16px;

    * { box-sizing: border-box; touch-action: manipulation; -webkit-user-select: none; user-select: none; } 
    input, textarea, select { -webkit-user-select: auto; user-select: auto; }
    html, body {

    .sub { color: var(--muted); font-size: 0.75em; margin-top: 3px; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .font-btn { background: var(--chip); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: bold; }
    
    .grid { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .card { background: rgba(17,24,39,.92); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); transform: translateZ(0); }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
    .stat .label { color: var(--muted); font-size: 0.85em; font-weight: bold; margin: 0; }
    .stat .value { font-size: 1.2em; font-weight: 800; margin: 0; white-space: nowrap; font-family: monospace; }

    button.warn { background: linear-gradient(135deg, #d97706, #f59e0b); }
    button.bad { background: linear-gradient(135deg, #dc2626, #ef4444); }

    .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .title { font-weight: 800; font-size: 1em; }
    .meta { font-size: 0.8em; color: var(--muted); margin-top: 4px; line-height: 1.7; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: #132238; font-size: 0.75em; color: #cbd5e1; border: 1px solid #263246; }

    .muted { color: var(--muted); }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .fab { position: fixed; bottom: 18px; left: 18px; z-index: 50; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
    
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { width: min(100%, 760px); max-height: 90vh; overflow-y: auto; background: #0f172a; border-top-left-radius: 24px; border-top-right-radius: 24px; border: 1px solid #243041; padding: 16px; -webkit-overflow-scrolling: touch; transform: translateZ(0); }
    .modal.show, .modal-backdrop.show { display: flex; animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes splashSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .small { font-size: 0.75em; }
    .toast { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 200; display: none; }
    .toast.show { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .toast .card { padding: 12px 14px; text-align: center; background: #22c55e; color: #fff; font-weight: bold; border: none; }
    .section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #334155; }

    .dateFieldWrap { display: flex; gap: 8px; align-items: center; }

    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

        .stat .value { margin-top: 8px; }
    }
  </style>

let currentFontSize = parseInt(localStorage.getItem('appFontSize')) || 16;
document.documentElement.style.setProperty('--fz', currentFontSize + 'px');

function changeFontSize(step) {
    currentFontSize += (step * 2);
    if(currentFontSize < 12) currentFontSize = 12;
    if(currentFontSize > 24) currentFontSize = 24;
    document.documentElement.style.setProperty('--fz', currentFontSize + 'px');
    localStorage.setItem('appFontSize', currentFontSize);
}

function div(a,b){ return ~~(a/b); }
function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365 * jy) + div(jy / 33, 1) * 8 + div(((jy % 33) + 3), 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * div(days, 146097);
  days %= 146097;
  if (days > 36524) { gy += 100 * div(--days, 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { gy += div(days - 1, 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal_a = [0,31,((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  let gm; for (gm = 1; gm <= 12 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
  return { gy, gm, gd };
}
function gregorianToJalali(gy, gm, gd){
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  gy = Number(gy); gm = Number(gm); gd = Number(gd);
  var jy; if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + div((gy2 + 3), 4) - div((gy2 + 99), 100) + div((gy2 + 399), 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * div(days, 12053); days %= 12053;
  jy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { jy += div(days - 1, 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + div(days, 31) : 7 + div(days - 186, 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return { jy, jm, jd };
}
function isoToJalaliParts(iso){
  if(!iso) return null; const [y,m,d] = iso.split('-').map(Number);
  try{ return gregorianToJalali(y,m,d); }catch(e){ return null; }
}
function isoToJalaliText(iso){
  const p = isoToJalaliParts(iso);
  if(!p) return '—';
  return `${p.jy}/${String(p.jm).padStart(2,'0')}/${String(p.jd).padStart(2,'0')}`;
}

window.addEventListener('popstate', function(e) {

function openModal(html){
  window.history.pushState({modal: true}, "");
  document.getElementById('modal').innerHTML = html;
  document.getElementById('backdrop').classList.add('show');
  document.body.style.overflow = 'hidden';
}

  window.history.back();
}

function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&','<':'<','>':'>','"':'&quot;',"'":'&#39;'}[m])); }

// سیستم مدیریت چندین عکس
window.currentImagesArray = [];

window.processImages = function(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const base64 = canvas.toDataURL('image/jpeg', 0.7);
                
                window.currentImagesArray.push(base64);
                window.renderImagePreviews();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    // خالی کردن اینپوت تا در صورت نیاز دوباره بتوان عکس اضافه کرد
    event.target.value = '';
};

window.renderImagePreviews = function() {
    const container = document.getElementById('imagePreviewsContainer');
    if (!container) return;
    container.innerHTML = '';
    window.currentImagesArray.forEach((b64, index) => {
        container.innerHTML += `
            <div style="position:relative; display:inline-block; margin:4px;">
                <img src="${b64}" onclick="showFullImage('${b64}')" style="width:70px; height:70px; border-radius:8px; object-fit:cover; border:1px solid var(--line); cursor:pointer;">
                <div onclick="removeImage(${index})" style="position:absolute; top:-6px; right:-6px; background:var(--bad); color:#fff; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:bold; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.5); z-index:10;">✕</div>
            </div>
        `;
    });
};

window.removeImage = function(index) {
    window.currentImagesArray.splice(index, 1);
    window.renderImagePreviews();
};

          <div><label>سال</label><select id="jYear"></select></div>
          <div><label>ماه</label><select id="jMonth"></select></div>
          <div><label>روز</label><select id="jDay"></select></div>
        </div>
        <div class="actions" style="margin-top:20px">
          <button class="primary" type="button" id="jSave">تایید تاریخ</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const p = isoToJalaliParts(initialIso || todayISO()) || {jy:1405,jm:1,jd:1};
  const yEl = overlay.querySelector('#jYear'), mEl = overlay.querySelector('#jMonth'), dEl = overlay.querySelector('#jDay');
  
  yEl.innerHTML = Array.from({length:15},(_,i)=>p.jy-7+i).map(y=>`<option value="${y}" ${y===p.jy?'selected':''}>${y}</option>`).join('');
  mEl.innerHTML = Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===p.jm?'selected':''}>${m}</option>`).join('');
  
  function fillDays(){
    const max = Number(mEl.value) <= 6 ? 31 : (Number(mEl.value) === 12 ? 29 : 30);
    const cur = Math.min(Number(p.jd||1), max);
    dEl.innerHTML = Array.from({length:max},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===cur?'selected':''}>${d}</option>`).join('');
  }
  yEl.onchange = fillDays; mEl.onchange = fillDays; fillDays();

  overlay.querySelector('#jSave').onclick = ()=>{
    const g = jalaliToGregorian(Number(yEl.value), Number(mEl.value), Number(dEl.value));
    onPick(`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`);
    overlay.remove();
  };
  
  window.closePickerOverlay = () => { overlay.remove(); };
}

function openForm(record=null){
  const r = record || {
    id:'', type:'debt', title:'', counterparty:'', invoiceNumber:'', images:[], amount:'', paidAmount:0, dueDate:todayISO(), issueDate: todayISO(), status:'open', notes:'',
    scheduleCount: 1, instEachAmount: '', installmentPaidCount: 0
  };

  // دریافت عکس‌ها برای حالت ویرایش (پشتیبانی از فرمت قدیم و جدید)
  window.currentImagesArray = r.images ? [...r.images] : (r.image ? [r.image] : []);

  if(r.type === 'installment' && !r.instEachAmount && r.scheduleCount > 1) {
    r.instEachAmount = Math.round(r.amount / r.scheduleCount);
  }
  if (r.type === 'installment' && r.paidAmount > 0 && (!r.installmentPaidCount || r.installmentPaidCount === 0)) {
    r.installmentPaidCount = Math.round(r.paidAmount / r.instEachAmount);
  }

  openModal(`
    <div class="modal-head">
      <div style="font-weight:800;font-size:1.2em">${record ? 'ویرایش' : 'ثبت جدید'}</div>
      <button type="button" onclick="closeModal()">بستن</button>
    </div>
    <form id="recordForm">
      <input type="hidden" name="id" value="${r.id}">
      <input type="hidden" name="installmentPaidCount" value="${r.installmentPaidCount||0}">
      
      <label>نوع تراکنش</label>
      <select name="type" id="typeField">
        ${Object.entries(typeLabels).map(([k,v])=>`<option value="${k}" ${r.type===k?'selected':''}>${v}</option>`).join('')}
      </select>
      
      <label>عنوان / شرح</label>
      <input name="title" value="${escapeHtml(r.title||'')}" placeholder="مثال: اجاره، وام..." required>
      
      <div class="row">
        <div>
           <label>طرف حساب (اختیاری)</label>
           <input name="counterparty" value="${escapeHtml(r.counterparty||'')}" placeholder="نام شخص/شرکت">
        </div>
        <div>
           <label>شماره فاکتور (اختیاری)</label>
           <input name="invoiceNumber" value="${escapeHtml(r.invoiceNumber||'')}" placeholder="مثلاً: 1405-23">
        </div>
      </div>

      <div class="section">
         <label style="color:var(--accent);">عکس فاکتور / سند (امکان انتخاب چند فایل)</label>
         <input type="file" id="invoiceImage" accept="image/*" multiple style="padding: 10px; font-size: 0.85em;" onchange="processImages(event)">
         <div id="imagePreviewsContainer" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: flex-start;"></div>
      </div>

      <div id="instSection" class="section hidden">
        <div class="row">
          <div><label>مبلغ هر قسط</label><input type="number" id="instEachAmount" value="${r.instEachAmount||''}" placeholder="مبلغ یک قسط"></div>
          <div><label>تعداد کل اقساط</label><input name="scheduleCount" type="number" id="instCount" min="1" value="${r.scheduleCount||1}"></div>
        </div>
      </div>

      <div class="row section">
        <div>
          <label id="amountLabel">مبلغ کل</label>
          <input name="amount" type="number" id="totalAmount" value="${r.amount||''}" placeholder="مبلغ نهایی" required>
        </div>
        <div>
          <label>پرداخت شده تا الان</label>
          <input name="paidAmount" type="number" value="${r.paidAmount||0}">
        </div>
      </div>

      <div class="row">
        <div>
          <label>سررسید</label>
          <div class="dateFieldWrap">
            <input id="dueDateField" class="readonlyLike" type="text" value="${isoToJalaliText(r.dueDate)}" readonly>
            <button type="button" id="pickDueDate">تغییر</button>
          </div>

        </div>

      <input class="readonlyLike" value="${stateLabels[r.status] || 'باز'}" readonly disabled>

      <label>یادداشت</label>
      <textarea name="notes">${escapeHtml(r.notes||'')}</textarea>
      
      <div class="actions" style="margin-top:16px">
        <button class="primary" type="submit" style="flex:1">ذخیره اطلاعات</button>

  const instSection = document.getElementById('instSection');
  const totalAmount = document.getElementById('totalAmount');
  const instEachAmount = document.getElementById('instEachAmount');
  const instCount = document.getElementById('instCount');
  const amountLabel = document.getElementById('amountLabel');

  function toggleSections(){
    if(typeField.value === 'installment'){
      instSection.classList.remove('hidden');
      totalAmount.setAttribute('readonly', 'true');
      amountLabel.innerText = 'مبلغ کل (محاسبه خودکار)';
    } else {
      instSection.classList.add('hidden');
      totalAmount.removeAttribute('readonly');
      amountLabel.innerText = 'مبلغ کل';
    }
  }
  
  function calcTotal(){
    if(typeField.value === 'installment'){
      const each = Number(instEachAmount.value || 0);
      const count = Number(instCount.value || 1);
      totalAmount.value = each * count;
    }
  }

  typeField.addEventListener('change', toggleSections);
  instEachAmount.addEventListener('input', calcTotal);
  instCount.addEventListener('input', calcTotal);
  toggleSections();

  document.getElementById('pickDueDate').onclick = (e) => {
      e.preventDefault(); 
      openPickerOverlay(document.getElementById('dueDateValue').value, (iso)=>{
        document.getElementById('dueDateValue').value = iso;
        document.getElementById('dueDateField').value = isoToJalaliText(iso);
      });
  };

  document.getElementById('recordForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    
    data.amount = Number(data.amount||0);
    data.paidAmount = Number(data.paidAmount||0);
    data.scheduleCount = Number(data.scheduleCount||1);
    data.installmentPaidCount = Number(data.installmentPaidCount||0);
    if(data.type === 'installment' && instEachAmount.value) {
      data.instEachAmount = Number(instEachAmount.value);
    }
    
    // جایگذاری آرایه عکس‌ها به جای یک عکس
    data.images = window.currentImagesArray;
    
    if(!record) data.id = uid();
    data.updatedAt = new Date().toISOString();
    
    if(data.type === 'installment' && data.scheduleCount > 1) {
       data.status = data.installmentPaidCount >= data.scheduleCount ? 'closed' : (data.installmentPaidCount > 0 ? 'partial' : 'open');
    } else {
       if (data.paidAmount >= data.amount && data.amount > 0) data.status = 'closed';
       else if (data.paidAmount > 0) data.status = 'partial';
       else data.status = 'open';
    }

    await saveRecord(data);
    closeModal();
    await render();
    showToast('ذخیره شد');
  });
}

async function processPayment(id){
  const item = await getRecord(id);
  if(!item) return;

  if(item.type === 'installment' && Number(item.scheduleCount) > 1) {
    let each = item.instEachAmount || (item.amount / item.scheduleCount);
    let paidCount = item.installmentPaidCount || 0;
    
    if (paidCount === 0 && item.paidAmount > 0 && each > 0) {
        paidCount = Math.round(item.paidAmount / each);
    }

    const rem = item.scheduleCount - paidCount;
    if(rem <= 0) { showToast('همه اقساط پرداخت شده است!'); return; }
    
    customConfirm(`آیا یک قسط به مبلغ\n<b style="font-size:1.3em">${formatMoney(each)} تومان</b>\nپرداخت شده است؟`, async () => {
       item.installmentPaidCount = paidCount + 1;
       item.paidAmount = item.installmentPaidCount * each;
       item.status = item.installmentPaidCount >= item.scheduleCount ? 'closed' : 'partial';
       
       if(item.status !== 'closed' && item.dueDate) {
           let [y, m, d] = item.dueDate.split('-').map(Number);
           m += 1;
           if (m > 12) { m -= 12; y += 1; }
           let daysInNextMonth = new Date(y, m, 0).getDate();
           if (d > daysInNextMonth) d = daysInNextMonth;
           item.dueDate = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
       }

       await saveRecord(item);
       showToast('یک قسط کسر شد و سررسید تمدید شد');
       await render();
    });
  } else {
    const remAmt = Math.max(0, item.amount - item.paidAmount);
    if(remAmt <= 0) { showToast('این مورد تسویه شده است'); return; }
    
    customPrompt('چه مبلغی الان پرداخت می‌کنید؟ (برای تسویه کامل دست نزنید)', formatMoney(remAmt), async (amt) => {
        if(amt === null) return;
        const num = Number(String(amt).replace(/,/g, ''));
        if(!num || num <= 0) return;
        
        item.paidAmount = (item.paidAmount || 0) + num;
        item.status = item.paidAmount >= item.amount ? 'closed' : 'partial';
        await saveRecord(item);
        showToast('پرداخت ثبت شد');
        await render();
    });
  }
}

async function initDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
  });
}

function tx(storeName=STORE, mode='readonly'){ return db.transaction(storeName, mode).objectStore(storeName); }
function getAll(){ return new Promise((res,rej)=>{ const r = tx(STORE).getAll(); r.onsuccess=()=>res(r.result||[]); }); }
function getRecord(id){ return new Promise((res,rej)=>{ const r = tx(STORE).get(id); r.onsuccess=()=>res(r.result); }); }
function saveRecord(record){ return new Promise((res,rej)=>{ const r = tx(STORE, 'readwrite').put(record); r.onsuccess=()=>res(true); }); }
async function softDeleteRecord(id){ const r=await getRecord(id); if(r){ r.deleted=true; await saveRecord(r); } }

function sortRecords(arr){
  const sortBy = document.getElementById('sortBy').value;
  return arr.sort((a,b)=>{
    if (sortBy === 'dueAsc') return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
    if (sortBy === 'updatedDesc') return (b.updatedAt||'').localeCompare(a.updatedAt||'');
    if (sortBy === 'amountDesc') return (b.amount||0)-(a.amount||0);
    return (a.amount||0)-(b.amount||0);
  });
}

function isOverdue(r){
  if (r.status === 'closed') return false;
  return r.dueDate && r.dueDate < todayISO();
}

function filtered(arr){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let out = arr.filter(r=> !r.deleted).filter(r=>{
    const searchHit = !q || [r.title,r.counterparty,r.notes,r.invoiceNumber].join(' ').toLowerCase().includes(q);
    const tabHit = currentTab === 'all' || (currentTab === 'overdue' ? isOverdue(r) : r.type === currentTab);
    const statusHit = currentStatus === 'all-status' || r.status === currentStatus;
    return searchHit && tabHit && statusHit;
  });
  return sortRecords(out);
}

        imgHTML = `

      let each = r.instEachAmount || (r.amount / r.scheduleCount);

              <div class="meta">${escapeHtml(r.counterparty||'—')}</div>

async function render(){
  const rows = await getAll();
  let debt = 0, overdueDebt = 0, overdueInst = 0;
  let alerts = [];
  const today = todayISO();
  const next7 = daysFromNow(7);

  rows.filter(r=>!r.deleted && r.status!=='closed').forEach(r=>{
    const rem = Math.max(0, r.amount - (r.paidAmount||0));
    if(r.type === 'debt' || r.type === 'installment' || r.type === 'expense') debt += rem;
    
    let amtForAlert = rem;
    if(r.type === 'installment' && r.scheduleCount > 1) { amtForAlert = r.instEachAmount || Math.round(r.amount / r.scheduleCount); }

    if (r.dueDate && r.dueDate < today) {
       if(r.type === 'debt' || r.type === 'expense') overdueDebt += rem;
       if(r.type === 'installment') overdueInst += amtForAlert;
       alerts.push({ ...r, alertType: 'overdue', alertAmt: amtForAlert });
    } else if (r.dueDate && r.dueDate >= today && r.dueDate <= next7) {
       alerts.push({ ...r, alertType: 'upcoming', alertAmt: amtForAlert });
    }
  });
  
  document.getElementById('statDebt').textContent = formatMoney(debt);
  document.getElementById('statOverdueDebt').textContent = formatMoney(overdueDebt);
  document.getElementById('statOverdueInst').textContent = formatMoney(overdueInst);

  const remindersWrap = document.getElementById('remindersWrap');
  if(alerts.length > 0) {
      alerts.sort((a,b) => a.dueDate.localeCompare(b.dueDate));
      remindersWrap.innerHTML = `
        <div class="card" style="border: 1px solid var(--warn); background: rgba(245,158,11,0.08); margin-bottom:12px;">
          <div style="color:var(--warn); font-weight:800; font-size:1.1em; margin-bottom:12px; display:flex; align-items:center; gap:6px;">
            <span>🔔</span> نیازمند توجه
          </div>
          ${alerts.map(r => `
            <div style="background:var(--bg); border:1px solid #334155; padding:10px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:bold; font-size:0.9em; margin-bottom:4px;">
                  ${escapeHtml(r.title)}
                  ${r.alertType === 'overdue' ? '<span class="pill bad" style="padding:2px 6px; font-size:0.7em">گذشته</span>' : '<span class="pill warn" style="padding:2px 6px; font-size:0.7em">نزدیک</span>'}
                </div>
                <div class="small muted">${typeLabels[r.type]||r.type} • ${isoToJalaliText(r.dueDate)}</div>
              </div>
              <div style="font-family:monospace; font-weight:bold; color:var(--text)">${formatMoney(r.alertAmt)}</div>
            </div>
          `).join('')}
        </div>
      `;
  } else { remindersWrap.innerHTML = ''; }

  renderList(filtered(rows));
}

  };

  document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try {
        const d = JSON.parse(r.result);
        const rows = Array.isArray(d) ? d : (d.records || []);
        for(let x of rows) {
          if (x.issueDateEpochDay && !x.issueDate) x.issueDate = new Date(x.issueDateEpochDay * 86400000).toISOString().split('T')[0];
          if (x.dueDateEpochDay && !x.dueDate) x.dueDate = new Date(x.dueDateEpochDay * 86400000).toISOString().split('T')[0];

          await saveRecord(x);
        }
        await render();
        showToast('با موفقیت بازیابی شد');
      } catch(err) {
        alert('فایل بک‌آپ خوانده نشد.');
      }
    }; 
    r.readAsText(f); 
    e.target.value='';
  };
}

initDB().then(()=>{ bindUI(); render(); });
</script>
</body>
</html>
