<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <title>دفتر مالی کارگاه</title>
  <style>
    :root {
      --bg: #0b1220; --panel: #111827; --panel2: #0f172a; --line: #243041; 
      --text: #e5e7eb; --muted: #94a3b8; --accent: #38bdf8; --good: #22c55e; 
      --warn: #f59e0b; --bad: #ef4444; --chip: #1e293b;
      --c-inst: #a855f7; --c-debt: #ef4444; --c-exp: #0ea5e9; --c-chq: #f59e0b; --c-rec: #22c55e;
      --fz: 16px;
    }
    * { 
      box-sizing: border-box; 
      touch-action: manipulation; 
      -webkit-user-select: none; 
      user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    } 
    input, textarea, select { -webkit-user-select: auto; user-select: auto; }
    html, body { 
      margin: 0; padding: 0; background: linear-gradient(180deg, #08101d 0%, #0b1220 100%); 
      color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: var(--fz); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
    }
    body { min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 12px 90px; transform: translateZ(0); }
    
    .top { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { font-weight: 800; font-size: 1.1em; }
    .sub { color: var(--muted); font-size: 0.72em; margin-top: 3px; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .font-btn { background: var(--chip); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 10px; cursor: pointer; font-weight: bold; font-size: 0.85em; }
    .top-backup-btn { background: var(--chip); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-weight: 800; font-size: 0.82em; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .top-backup-btn.nc-ok { background: linear-gradient(135deg, #16a34a, #22c55e); border-color: #22c55e; color: #fff; box-shadow: 0 4px 12px rgba(34,197,94,0.25); }
    .top-backup-btn.nc-sync { background: linear-gradient(135deg, #d97706, #f59e0b); border-color: #f59e0b; color: #fff; }
    .top-backup-btn.nc-err { background: rgba(239,68,68,0.2); border-color: var(--bad); color: #fca5a5; }
    
    .grid { display: flex; flex-direction: column; gap: 8px; margin: 10px 0 12px; }
    .card { background: rgba(17,24,39,.92); border: 1px solid var(--line); border-radius: 18px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.18); transform: translateZ(0); }
    .stat { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
    .stat .label { color: var(--muted); font-size: 0.85em; font-weight: bold; margin: 0; }
    .stat .value { font-size: 1.2em; font-weight: 800; margin: 0; white-space: nowrap; font-family: monospace; }
    
    button, .btn { border: 0; border-radius: 14px; padding: 11px 14px; font-weight: 700; background: var(--chip); color: var(--text); cursor: pointer; font-size: 0.9em; }
    button.primary { background: linear-gradient(135deg, #0ea5e9, #2563eb); color: #fff; }
    button.good { background: linear-gradient(135deg, #16a34a, #22c55e); color: #fff; }
    button.warn { background: linear-gradient(135deg, #d97706, #f59e0b); color: #fff; }
    button.bad { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; }
    button:active { transform: scale(.97); }
    
    input, select, textarea { width: 100%; border-radius: 12px; border: 1px solid #334155; background: #0b1220; color: var(--text); padding: 10px 12px; font-size: 0.92em; outline: none; font-family: inherit; }
    input[type=number] { font-family: monospace; direction: ltr; text-align: left; }
    textarea { min-height: 84px; resize: vertical; }
    input[readonly], input:disabled { background: #1e293b; color: #94a3b8; border-color: #0f172a; }
    label { display: block; font-size: 0.78em; color: var(--muted); margin: 10px 0 5px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .list { display: flex; flex-direction: column; gap: 10px; }
    .item { background: rgba(15,23,42,.95); border: 1px solid var(--line); border-radius: 18px; padding: 12px; transform: translateZ(0); }
    .item-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .title { font-weight: 800; font-size: 1em; }
    .meta { font-size: 0.8em; color: var(--muted); margin-top: 4px; line-height: 1.7; }
    .amount-display { font-family: monospace; font-weight: 800; font-size: 1.1em; direction: ltr; text-align: right; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: #132238; font-size: 0.75em; color: #cbd5e1; border: 1px solid #263246; }
    .pill.good { background: rgba(34,197,94,.14); color: #86efac; border-color: rgba(34,197,94,.28); }
    .pill.warn { background: rgba(245,158,11,.12); color: #fcd34d; border-color: rgba(245,158,11,.26); }
    .pill.bad { background: rgba(239,68,68,.12); color: #fca5a5; border-color: rgba(239,68,68,.26); }
    
    .type-badge-installment { background: rgba(168,85,247,.16); color: #d8b4fe; border-color: rgba(168,85,247,.35); }
    .type-badge-debt { background: rgba(239,68,68,.16); color: #fca5a5; border-color: rgba(239,68,68,.35); }
    .type-badge-expense { background: rgba(14,165,233,.16); color: #7dd3fc; border-color: rgba(14,165,233,.35); }
    .type-badge-cheque { background: rgba(245,158,11,.16); color: #fcd34d; border-color: rgba(245,158,11,.35); }
    .type-badge-receivable { background: rgba(34,197,94,.16); color: #86efac; border-color: rgba(34,197,94,.35); }

    .radar-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .month-nav { display: flex; align-items: center; gap: 6px; background: #0b1220; padding: 3px 5px; border-radius: 10px; border: 1px solid var(--line); }
    .month-nav button { padding: 4px 9px; border-radius: 7px; background: var(--chip); font-size: 0.8em; }
    .month-title { font-weight: 800; font-size: 0.85em; min-width: 90px; text-align: center; }
    .radar-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .r-box { background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; border-right-width: 4px; }
    .r-box .r-lbl { font-size: 0.72em; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .r-box .r-val { font-family: monospace; font-weight: 800; font-size: 0.95em; direction: ltr; text-align: right; }
    
    .cal-strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: #0b1220; padding: 10px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 12px; }
    .cal-day { aspect-ratio: 1; border-radius: 10px; background: #111827; border: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-size: 0.75em; color: var(--muted); cursor: pointer; }
    .cal-day.has-item { color: #fff; font-weight: 800; background: #1e293b; border-color: #334155; }
    .cal-day.is-today { border: 2px solid var(--accent); color: var(--accent); font-weight: 800; }
    .cal-dots { display: flex; gap: 3px; margin-top: 3px; flex-wrap: wrap; justify-content: center; max-width: 90%; }
    .cal-dot { width: 6px; height: 6px; border-radius: 50%; }

    .tl-list { display: flex; flex-direction: column; }
    .tl-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #0b1220; border: 1px solid var(--line); border-right-width: 4px; border-radius: 12px; padding: 10px 12px; cursor: pointer; }
    .tl-gap { display: flex; align-items: center; gap: 8px; padding: 4px 16px; color: var(--muted); font-size: 0.72em; }
    .tl-gap-line { width: 2px; height: 18px; border-right: 2px dashed #334155; margin-left: 6px; }

    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .actions button { padding: 8px 12px; border-radius: 12px; font-size: 0.85em; }
    .muted { color: var(--muted); }
    .empty { padding: 24px; text-align: center; color: var(--muted); }
    .fab { position: fixed; bottom: 18px; left: 18px; z-index: 50; box-shadow: 0 10px 24px rgba(0,0,0,.45); padding: 13px 18px; font-size: 0.95em; }
    
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal { width: min(100%, 760px); max-height: 90vh; overflow-y: auto; background: #0f172a; border-top-left-radius: 24px; border-top-right-radius: 24px; border: 1px solid #243041; padding: 16px; -webkit-overflow-scrolling: touch; transform: translateZ(0); }
    .modal.show, .modal-backdrop.show { display: flex; animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1); }
    
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes splashSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes autoHideSplash { 0%, 75% { opacity: 1; visibility: visible; } 100% { opacity: 0; visibility: hidden; pointer-events: none; } }

    #splashScreen {
      position: fixed; inset: 0; background: linear-gradient(180deg, #08101d 0%, #0b1220 100%);
      z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: autoHideSplash 1.1s ease forwards;
    }

    .modal-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .small { font-size: 0.75em; }
    .toast { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 200; display: none; }
    .toast.show { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .toast .card { padding: 12px 14px; text-align: center; background: #22c55e; color: #fff; font-weight: bold; border: none; }
    .section { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #334155; }
    .hidden { display: none !important; }
    .dateFieldWrap { display: flex; gap: 8px; align-items: center; }
    .dateFieldWrap input { flex: 1; }
    .dateFieldWrap button { white-space: nowrap; padding: 10px 10px; }
    .picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    
    @media (min-width: 600px) {
        .grid { flex-direction: row; }
        .stat { flex-direction: column; align-items: flex-start; flex: 1; }
        .stat .value { margin-top: 8px; }
        .radar-summary { grid-template-columns: repeat(4, 1fr); }
        .cal-strip { grid-template-columns: repeat(10, 1fr); }
    }
  </style>
</head>

<script>
let currentFontSize = parseInt(localStorage.getItem('appFontSize')) || 16;
document.documentElement.style.setProperty('--fz', currentFontSize + 'px');

function changeFontSize(step) {
    currentFontSize += (step * 2);
    if(currentFontSize < 12) currentFontSize = 12;
    if(currentFontSize > 24) currentFontSize = 24;
    document.documentElement.style.setProperty('--fz', currentFontSize + 'px');
    localStorage.setItem('appFontSize', currentFontSize);
}

const DB_NAME = 'workshop_finance_db';
const DB_VERSION = 3;
const STORE = 'records';
let db;
let currentTab = 'all';
let currentStatus = 'open';

const formatMoney = (n) => (Number(n||0)).toLocaleString('en-US');
const todayISO = () => new Date().toISOString().slice(0,10);
const daysFromNow = (n) => { const d=new Date(); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const uid = () => String(Date.now())+Math.random().toString(16).slice(2);

function div(a,b){ return ~~(a/b); }
function jalaliToGregorian(jy, jm, jd) {
  jy += 1595;
  let days = -355668 + (365 * jy) + div(jy / 33, 1) * 8 + div(((jy % 33) + 3), 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * div(days, 146097);
  days %= 146097;
  if (days > 36524) { gy += 100 * div(--days, 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { gy += div(days - 1, 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal_a = [0,31,((gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0)) ? 29 : 28,31,30,31,30,31,31,30,31,30,31];
  let gm; for (gm = 1; gm <= 12 && gd > sal_a[gm]; gm++) gd -= sal_a[gm];
  return { gy, gm, gd };
}
function gregorianToJalali(gy, gm, gd){
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  gy = Number(gy); gm = Number(gm); gd = Number(gd);
  var jy; if (gy > 1600) { jy = 979; gy -= 1600; } else { jy = 0; gy -= 621; }
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + div((gy2 + 3), 4) - div((gy2 + 99), 100) + div((gy2 + 399), 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * div(days, 12053); days %= 12053;
  jy += 4 * div(days, 1461); days %= 1461;
  if (days > 365) { jy += div(days - 1, 365); days = (days - 1) % 365; }
  var jm = (days < 186) ? 1 + div(days, 31) : 7 + div(days - 186, 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return { jy, jm, jd };
}
function isoToJalaliParts(iso){
  if(!iso) return null; const [y,m,d] = iso.split('-').map(Number);
  try{ return gregorianToJalali(y,m,d); }catch(e){ return null; }
}
function isoToJalaliText(iso){
  const p = isoToJalaliParts(iso);
  if(!p) return '—';
  return `${p.jy}/${String(p.jm).padStart(2,'0')}/${String(p.jd).padStart(2,'0')}`;
}

const jalaliMonthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const todayJParts = isoToJalaliParts(todayISO()) || { jy: 1405, jm: 1, jd: 1 };
let radarYear = todayJParts.jy;
let radarMonth = todayJParts.jm;
let radarCollapsed = false;

window.changeRadarMonth = function(delta) {
  radarMonth += delta;
  if (radarMonth > 12) { radarMonth = 1; radarYear++; }
  if (radarMonth < 1) { radarMonth = 12; radarYear--; }
  render();
};

window.toggleRadarBody = function() {
  radarCollapsed = !radarCollapsed;
  render();
};

const typeLabels = { debt: 'بدهی', receivable: 'طلب', cheque: 'چک', installment: 'قسط', expense: 'هزینه ثابت', income: 'درآمد' };
const typeColors = {
  installment: '#a855f7',
  debt: '#ef4444',
  expense: '#0ea5e9',
  cheque: '#f59e0b',
  receivable: '#22c55e',
  income: '#22c55e'
};

function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastText').innerHTML = msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 2300);
}

function getNcConfig() {
  try { return JSON.parse(localStorage.getItem('ncConfig') || '{}'); } catch(e) { return {}; }
}

function setNcStatus(state, text) {
  const btn = document.getElementById('topBackupBtn');
  const lbl = document.getElementById('topBackupLabel');

  if (btn) {

function buildWebdavUrl(cfg) {
  let base = (cfg.url || '').trim().replace(/\/+$/, '');
  if (base && !/^https?:\/\//i.test(base)) base = 'https://' + base;
  let user = encodeURIComponent((cfg.user || '').trim());
  let file = (cfg.filename || 'WorkshopFinance_Backup.json').trim().replace(/^\/+/, '');
  if (base.includes('/remote.php/')) {
    return `${base}/${file}`;
  }
  return `${base}/remote.php/dav/files/${user}/${file}`;
}

// ارسال درخواست WebDAV سازگار با پلاگین بومی و XHR
function webdavRequest(method, url, authHeader, bodyStr) {
  return new Promise((resolve, reject) => {
    if (window.cordova && window.cordova.plugin && window.cordova.plugin.http) {
      window.cordova.plugin.http.setDataSerializer('utf8');
      const options = {
        method: method.toLowerCase(),
        headers: { 'Authorization': authHeader, 'Content-Type': 'application/json; charset=utf-8' }
      };
      if (bodyStr) options.data = bodyStr;
      window.cordova.plugin.http.sendRequest(url, options, function(resp) {
        resolve({ ok: resp.status >= 200 && resp.status < 300, status: resp.status, text: resp.data });
      }, function(err) {
        reject(err);
      });
      return;
    }
    const xhr = new XMLHttpRequest();
    xhr.open(method, url, true);
    xhr.setRequestHeader('Authorization', authHeader);
    if (bodyStr) xhr.setRequestHeader('Content-Type', 'application/json; charset=utf-8');
    xhr.onload = function() {
      resolve({ ok: xhr.status >= 200 && xhr.status < 300, status: xhr.status, text: xhr.responseText });
    };
    xhr.onerror = function() { reject(new Error('Network/CORS error')); };
    xhr.send(bodyStr || null);
  });
}

window.uploadToNextcloud = async function(silent = false) {
  const cfg = getNcConfig();
  if (!cfg.url || !cfg.user || !cfg.pass) {
    if (!silent) showToast('ابتدا آدرس و رمز نکست‌کلاد را وارد کنید');
    return;
  }
  setNcStatus('sync', '☁️ در حال ارسال به نکست‌کلاد...');
  try {
    const rows = await getAll();
    const payload = { app: "Workshop Finance Pro", schemaVersion: 4, exportedAt: new Date().toISOString(), records: rows };
    const jsonStr = JSON.stringify(payload, null, 2);
    const targetUrl = buildWebdavUrl(cfg);
    const auth = 'Basic ' + btoa(unescape(encodeURIComponent(`${cfg.user.trim()}:${cfg.pass.trim()}`)));

    const res = await webdavRequest('PUT', targetUrl, auth, jsonStr);

    if (res.ok || res.status === 201 || res.status === 204) {
      const nowTime = new Date().toTimeString().slice(0,5);
      localStorage.setItem('ncLastOk', nowTime);
      setNcStatus('ok', `☁️ بکاپ ابری فعال (${nowTime})`);
      if (!silent) showToast('✅ بکاپ در سرور نکست‌کلاد ذخیره شد');
    } else {
      setNcStatus('err', `⚠️ خطای سرور (${res.status})`);
      if (!silent) showToast(`خطای سرور نکست‌کلاد (کد ${res.status})`);
    }
  } catch (err) {
    setNcStatus('err', '⚠️ سرور در دسترس نیست (از بکاپ دستی استفاده کنید)');
    if (!silent) showToast('عدم ارتباط مستقیم با سرور؛ از دکمه ارسال فایل بکاپ استفاده کنید');
  }
};

window.downloadFromNextcloud = async function() {
  saveNcInputs();
  const cfg = getNcConfig();
  if (!cfg.url || !cfg.user || !cfg.pass) {
    showToast('ابتدا مشخصات سرور نکست‌کلاد را وارد کنید');
    return;
  }
  setNcStatus('sync', '☁️ در حال دریافت از نکست‌کلاد...');
  try {
    const targetUrl = buildWebdavUrl(cfg);
    const auth = 'Basic ' + btoa(unescape(encodeURIComponent(`${cfg.user.trim()}:${cfg.pass.trim()}`)));
    const res = await webdavRequest('GET', targetUrl, auth, null);
    if (!res.ok) {
      setNcStatus('err', `⚠️ خطا در دریافت (${res.status})`);
      showToast('فایل بکاپ در سرور پیدا نشد یا رمز اشتباه است');
      return;
    }
    const d = JSON.parse(res.text);
    const rows = Array.isArray(d) ? d : (d.records || []);
    for (let x of rows) {
      if (x.issueDateEpochDay && !x.issueDate) x.issueDate = new Date(x.issueDateEpochDay * 86400000).toISOString().split('T')[0];
      if (x.dueDateEpochDay && !x.dueDate) x.dueDate = new Date(x.dueDateEpochDay * 86400000).toISOString().split('T')[0];
      if (x.type === 'installment' && x.scheduleCount > 1 && !x.instEachAmount) x.instEachAmount = Math.round(x.amount / x.scheduleCount);
      await saveRecord(x, true);
    }
    await render();
    localStorage.setItem('ncLastOk', new Date().toTimeString().slice(0,5));
    setNcStatus('ok', '☁️ بازیابی از نکست‌کلاد انجام شد');
    closeModal();
    showToast('✅ اطلاعات از نکست‌کلاد بازیابی شد');
  } catch (err) {
    setNcStatus('err', '⚠️ خطا در دریافت از سرور');
    showToast('خطا در ارتباط با سرور نکست‌کلاد');
  }
};

window.currentImagesArray = [];

window.processImages = function(event) {
    const files = event.target.files;
    if (!files || files.length === 0) return;

    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 800;
                let width = img.width;
                let height = img.height;
                if (width > MAX_WIDTH) {
                    height *= MAX_WIDTH / width;
                    width = MAX_WIDTH;
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const base64 = canvas.toDataURL('image/jpeg', 0.7);
                
                window.currentImagesArray.push(base64);
                window.renderImagePreviews();
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
    event.target.value = '';
};

window.renderImagePreviews = function() {
    const container = document.getElementById('imagePreviewsContainer');

function openPickerOverlay(initialIso, onPick){
  const overlay = document.createElement('div');
  overlay.className = 'modal-backdrop show';
  overlay.id = 'datePickerOverlay';
  overlay.style.zIndex = 300;
  overlay.innerHTML = `
    <div class="modal" style="margin:auto;">

      <div class="card" style="background:#0b1220;">

          <div><label>سال</label><select id="jYear"></select></div>
          <div><label>ماه</label><select id="jMonth"></select></div>
          <div><label>روز</label><select id="jDay"></select></div>
        </div>
        <div class="actions" style="margin-top:20px">
          <button class="primary" type="button" id="jSave">تایید تاریخ</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const p = isoToJalaliParts(initialIso || todayISO()) || {jy:1405,jm:1,jd:1};
  const yEl = overlay.querySelector('#jYear'), mEl = overlay.querySelector('#jMonth'), dEl = overlay.querySelector('#jDay');
  
  yEl.innerHTML = Array.from({length:15},(_,i)=>p.jy-7+i).map(y=>`<option value="${y}" ${y===p.jy?'selected':''}>${y}</option>`).join('');
  mEl.innerHTML = Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${m}" ${m===p.jm?'selected':''}>${m}</option>`).join('');
  
  function fillDays(){
    const max = Number(mEl.value) <= 6 ? 31 : (Number(mEl.value) === 12 ? 29 : 30);
    const cur = Math.min(Number(p.jd||1), max);
    dEl.innerHTML = Array.from({length:max},(_,i)=>i+1).map(d=>`<option value="${d}" ${d===cur?'selected':''}>${d}</option>`).join('');
  }
  yEl.onchange = fillDays; mEl.onchange = fillDays; fillDays();

  overlay.querySelector('#jSave').onclick = ()=>{
    const g = jalaliToGregorian(Number(yEl.value), Number(mEl.value), Number(dEl.value));
    onPick(`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`);
    overlay.remove();
  };
  
  window.closePickerOverlay = () => { overlay.remove(); };
}

      </div>

      <div class="row">
        <div>
          <label>سررسید</label>
          <div class="dateFieldWrap">
            <input id="dueDateField" class="readonlyLike" type="text" value="${isoToJalaliText(r.dueDate)}" readonly>
            <button type="button" id="pickDueDate">تغییر</button>
          </div>
          <input type="hidden" name="dueDate" id="dueDateValue" value="${r.dueDate||todayISO()}">
        </div>
      </div>

      <label>وضعیت (محاسبه خودکار)</label>
      <input class="readonlyLike" value="${stateLabels[r.status] || 'باز'}" readonly disabled>

      <label>یادداشت</label>
      <textarea name="notes">${escapeHtml(r.notes||'')}</textarea>
      
      <div class="actions" style="margin-top:16px; display: flex; gap: 8px;">
        ${record && r.status !== 'closed' ? `<button type="button" class="good" style="flex:1" onclick="closeModal(); setTimeout(() => processPayment('${r.id}'), 150);">💳 ثبت پرداخت</button>` : ''}
        <button class="primary" type="submit" style="${record && r.status !== 'closed' ? 'flex:1.5' : 'flex:1'}">ذخیره اطلاعات</button>
      </div>
    </form>
  `);

  setTimeout(window.renderImagePreviews, 50);

  const typeField = document.getElementById('typeField');
  const instSection = document.getElementById('instSection');
  const totalAmount = document.getElementById('totalAmount');
  const instEachAmount = document.getElementById('instEachAmount');
  const instCount = document.getElementById('instCount');
  const amountLabel = document.getElementById('amountLabel');

  function toggleSections(){
    if(typeField.value === 'installment'){
      instSection.classList.remove('hidden');
      totalAmount.setAttribute('readonly', 'true');
      amountLabel.innerText = 'مبلغ کل (محاسبه خودکار)';
    } else {
      instSection.classList.add('hidden');
      totalAmount.removeAttribute('readonly');
      amountLabel.innerText = 'مبلغ کل';
    }
  }
  
  function calcTotal(){
    if(typeField.value === 'installment'){
      const each = Number(instEachAmount.value || 0);
      const count = Number(instCount.value || 1);
      totalAmount.value = each * count;
    }
  }

  typeField.addEventListener('change', toggleSections);
  instEachAmount.addEventListener('input', calcTotal);
  instCount.addEventListener('input', calcTotal);
  toggleSections();

  document.getElementById('pickDueDate').onclick = (e) => {
      e.preventDefault(); 
      openPickerOverlay(document.getElementById('dueDateValue').value, (iso)=>{
        document.getElementById('dueDateValue').value = iso;
        document.getElementById('dueDateField').value = isoToJalaliText(iso);
      });
  };

  document.getElementById('recordForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    
    data.amount = Number(data.amount||0);
    data.paidAmount = Number(data.paidAmount||0);
    data.scheduleCount = Number(data.scheduleCount||1);
    data.installmentPaidCount = Number(data.installmentPaidCount||0);
    if(data.type === 'installment' && instEachAmount.value) {
      data.instEachAmount = Number(instEachAmount.value);
    }
    
    data.images = window.currentImagesArray;
    
    if(!record) data.id = uid();
    data.updatedAt = new Date().toISOString();
    
    if(data.type === 'installment' && data.scheduleCount > 1) {
       data.status = data.installmentPaidCount >= data.scheduleCount ? 'closed' : (data.installmentPaidCount > 0 ? 'partial' : 'open');
    } else {
       if (data.paidAmount >= data.amount && data.amount > 0) data.status = 'closed';
       else if (data.paidAmount > 0) data.status = 'partial';
       else data.status = 'open';
    }

    await saveRecord(data);
    closeModal();
    await render();
    showToast('ذخیره شد');
  });
}

async function processPayment(id){
  const item = await getRecord(id);
  if(!item) return;

  if(item.type === 'installment' && Number(item.scheduleCount) > 1) {
    let each = item.instEachAmount || (item.amount / item.scheduleCount);
    let paidCount = item.installmentPaidCount || 0;
    
    if (paidCount === 0 && item.paidAmount > 0 && each > 0) {
        paidCount = Math.round(item.paidAmount / each);
    }

    const rem = item.scheduleCount - paidCount;
    if(rem <= 0) { showToast('همه اقساط پرداخت شده است!'); return; }
    
    customConfirm(`آیا یک قسط به مبلغ\n<b style="font-size:1.3em">${formatMoney(each)} تومان</b>\nپرداخت شده است؟`, async () => {
       item.installmentPaidCount = paidCount + 1;
       item.paidAmount = item.installmentPaidCount * each;
       item.status = item.installmentPaidCount >= item.scheduleCount ? 'closed' : 'partial';
       
       if(item.status !== 'closed' && item.dueDate) {
           let [y, m, d] = item.dueDate.split('-').map(Number);
           m += 1;
           if (m > 12) { m -= 12; y += 1; }
           let daysInNextMonth = new Date(y, m, 0).getDate();
           if (d > daysInNextMonth) d = daysInNextMonth;
           item.dueDate = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
       }

       item.updatedAt = new Date().toISOString();
       await saveRecord(item);
       showToast('یک قسط کسر شد و سررسید تمدید شد');
       await render();
    });
  } else {
    const remAmt = Math.max(0, item.amount - item.paidAmount);
    if(remAmt <= 0) { showToast('این مورد تسویه شده است'); return; }
    
    customPrompt('چه مبلغی الان پرداخت می‌کنید؟ (برای تسویه کامل دست نزنید)', formatMoney(remAmt), async (amt) => {
        if(amt === null) return;
        const num = Number(String(amt).replace(/,/g, ''));
        if(!num || num <= 0) return;
        
        item.paidAmount = (item.paidAmount || 0) + num;
        item.status = item.paidAmount >= item.amount ? 'closed' : 'partial';
        item.updatedAt = new Date().toISOString();
        await saveRecord(item);
        showToast('پرداخت ثبت شد');
        await render();
    });
  }
}

async function initDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
  });
}

function tx(storeName=STORE, mode='readonly'){ return db.transaction(storeName, mode).objectStore(storeName); }
function getAll(){ return new Promise((res,rej)=>{ const r = tx(STORE).getAll(); r.onsuccess=()=>res(r.result||[]); }); }
function getRecord(id){ return new Promise((res,rej)=>{ const r = tx(STORE).get(id); r.onsuccess=()=>res(r.result); }); }
function saveRecord(record, skipCloud=false){
  return new Promise((res,rej)=>{
    const r = tx(STORE, 'readwrite').put(record);
    r.onsuccess=()=>{
      if(!skipCloud) triggerAutoBackup();
      res(true);
    };
  });
}
async function softDeleteRecord(id){
  const r=await getRecord(id);
  if(r){ r.deleted=true; r.updatedAt=new Date().toISOString(); await saveRecord(r); }
}

function sortRecords(arr){
  const sortBy = document.getElementById('sortBy').value;
  return arr.sort((a,b)=>{
    if (sortBy === 'dueAsc') return (a.dueDate||'9999').localeCompare(b.dueDate||'9999');
    if (sortBy === 'updatedDesc') return (b.updatedAt||'').localeCompare(a.updatedAt||'');
    if (sortBy === 'amountDesc') return (b.amount||0)-(a.amount||0);
    return (a.amount||0)-(b.amount||0);
  });
}

function isOverdue(r){
  if (r.status === 'closed') return false;
  return r.dueDate && r.dueDate < todayISO();
}

function filtered(arr){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let out = arr.filter(r=> !r.deleted).filter(r=>{
    const searchHit = !q || [r.title,r.counterparty,r.notes,r.invoiceNumber].join(' ').toLowerCase().includes(q);
    const tabHit = currentTab === 'all' || (currentTab === 'overdue' ? isOverdue(r) : r.type === currentTab);
    
    let statusHit = false;
    if (currentStatus === 'all-status') statusHit = true;
    else if (currentStatus === 'open') statusHit = (r.status === 'open' || r.status === 'partial');
    else statusHit = (r.status === currentStatus);
    
    return searchHit && tabHit && statusHit;
  });
  return sortRecords(out);
}

function renderMonthlyRadar(rows) {
  const wrap = document.getElementById('monthlyRadarWrap');
  if (!wrap) return;

  const maxDays = radarMonth <= 6 ? 31 : (radarMonth === 12 ? 29 : 30);
  const todayP = isoToJalaliParts(todayISO());

  const monthItems = [];
  let sumInst = 0, sumDebt = 0, sumExp = 0, sumChq = 0;

  rows.filter(r => !r.deleted && r.status !== 'closed' && ['installment', 'debt', 'expense', 'cheque'].includes(r.type)).forEach(r => {
    const p = isoToJalaliParts(r.dueDate);
    if (!p || p.jy !== radarYear || p.jm !== radarMonth) return;

    let payAmt = Math.max(0, Number(r.amount || 0) - Number(r.paidAmount || 0));
    if (r.type === 'installment') {
      payAmt = Number(r.instEachAmount || Math.round(r.amount / (r.scheduleCount || 1)));
      sumInst += payAmt;
    } else if (r.type === 'debt') {
      sumDebt += payAmt;
    } else if (r.type === 'expense') {
      sumExp += payAmt;
    } else if (r.type === 'cheque') {
      sumChq += payAmt;
    }

    monthItems.push({ ...r, jDay: p.jd, payAmt });
  });

  monthItems.sort((a, b) => a.jDay - b.jDay);
  const totalMonth = sumInst + sumDebt + sumExp + sumChq;

  const dayMap = {};
  monthItems.forEach(item => {
    if (!dayMap[item.jDay]) dayMap[item.jDay] = [];
    dayMap[item.jDay].push(item);
  });

  let calCellsHTML = '';
  for (let d = 1; d <= maxDays; d++) {
    const itemsOnDay = dayMap[d] || [];
    const isToday = todayP && todayP.jy === radarYear && todayP.jm === radarMonth && todayP.jd === d;
    const dotsHTML = itemsOnDay.map(it => `<span class="cal-dot" style="background:${typeColors[it.type] || '#fff'}"></span>`).join('');
    const clickAttr = itemsOnDay.length > 0 ? `onclick="editRecord('${itemsOnDay[0].id}')"` : '';

      <div class="cal-day ${itemsOnDay.length ? 'has-item' : ''} ${isToday ? 'is-today' : ''}" ${clickAttr}>
        <span>${d}</span>
        ${dotsHTML ? `<div class="cal-dots">${dotsHTML}</div>` : ''}
      </div>

  }

  let timelineHTML = '';
  if (monthItems.length === 0) {
    timelineHTML = `<div class="small muted" style="text-align:center; padding: 12px 0;">در این ماه هیچ قسط، بدهی یا هزینه بازی ثبت نشده است.</div>`;

      timelineHTML += `

          <div style="display:flex; align-items:center; gap:10px; min-width:0;">
            <div style="background:rgba(255,255,255,0.05); border:1px solid #334155; border-radius:10px; min-width:42px; height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center;">
              <span style="font-weight:800; font-size:0.95em; color:#fff;">${item.jDay}</span>
              <span style="font-size:0.6em; color:var(--muted);">${jalaliMonthNames[radarMonth - 1]}</span>

            ${formatMoney(item.payAmt)}
          </div>
        </div>
      `;
    });
  }

  wrap.innerHTML = `
    <div class="card" style="border-color:#26354d;">
      <div class="radar-head">
        <div onclick="toggleRadarBody()" style="cursor:pointer; display:flex; align-items:center; gap:6px; font-weight:800; font-size:0.92em; color:var(--accent);">
          <span>📅 رادار ماهانه</span>
          <span class="small muted">(${radarCollapsed ? 'تقویم و فاصله‌ها ▾' : 'بستن تقویم ▴'})</span>
        </div>
        <div class="month-nav">

          <div class="month-title">${jalaliMonthNames[radarMonth - 1]} ${radarYear}</div>
          <button type="button" onclick="changeRadarMonth(1)">❯</button>

      <div class="radar-summary">

          <div class="r-val" style="color:#d8b4fe">${formatMoney(sumInst)}</div>

      </div>

      <div class="${radarCollapsed ? 'hidden' : ''}" style="margin-top:12px;">
        <div class="small muted" style="margin-bottom:6px;">نمای روزهای ماه (نقطه‌های رنگی = روزهای پرداخت):</div>
        <div class="cal-strip">${calCellsHTML}</div>

async function render(){
  const rows = await getAll();
  let debt = 0, overdueDebt = 0, overdueInst = 0;
  let alerts = [];
  const today = todayISO();
  const next7 = daysFromNow(7);

  rows.filter(r=>!r.deleted && r.status!=='closed').forEach(r=>{
    const rem = Math.max(0, r.amount - (r.paidAmount||0));
    if(r.type === 'debt' || r.type === 'installment' || r.type === 'expense') debt += rem;
    
    let amtForAlert = rem;
    if(r.type === 'installment' && r.scheduleCount > 1) { amtForAlert = r.instEachAmount || Math.round(r.amount / r.scheduleCount); }

    if (r.dueDate && r.dueDate < today) {
       if(r.type === 'debt' || r.type === 'expense') overdueDebt += rem;
       if(r.type === 'installment') overdueInst += amtForAlert;
       alerts.push({ ...r, alertType: 'overdue', alertAmt: amtForAlert });
    } else if (r.dueDate && r.dueDate >= today && r.dueDate <= next7) {
       alerts.push({ ...r, alertType: 'upcoming', alertAmt: amtForAlert });
    }
  });
  
  document.getElementById('statDebt').textContent = formatMoney(debt);
  document.getElementById('statOverdueDebt').textContent = formatMoney(overdueDebt);
  document.getElementById('statOverdueInst').textContent = formatMoney(overdueInst);

  const remindersWrap = document.getElementById('remindersWrap');
  if(alerts.length > 0) {
      alerts.sort((a,b) => a.dueDate.localeCompare(b.dueDate));
      remindersWrap.innerHTML = `
        <div class="card" style="border: 1px solid var(--warn); background: rgba(245,158,11,0.08); margin-bottom:12px;">
          <div style="color:var(--warn); font-weight:800; font-size:1.05em; margin-bottom:10px; display:flex; align-items:center; gap:6px;">
            <span>🔔</span> نیازمند توجه
          </div>
          ${alerts.map(r => `
            <div onclick="editRecord('${r.id}')" style="cursor:pointer; background:var(--bg); border:1px solid #334155; border-right: 4px solid ${typeColors[r.type]||'#f59e0b'}; padding:10px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-weight:bold; font-size:0.9em; margin-bottom:4px;">
                  ${escapeHtml(r.title)}${r.alertType === 'overdue' ? '<span class="pill bad" style="padding:2px 6px; font-size:0.7em">گذشته</span>' : '<span class="pill warn" style="padding:2px 6px; font-size:0.7em">نزدیک</span>'}
                </div>
                <div class="small muted">${typeLabels[r.type]\vert{}\vert{}r.type} •${isoToJalaliText(r.dueDate)}</div>
              </div>
              <div style="font-family:monospace; font-weight:bold; color:var(--text)">${formatMoney(r.alertAmt)}</div>
            </div>
          `).join('')}
        </div>
      `;
  } else { remindersWrap.innerHTML = ''; }

  renderMonthlyRadar(rows);
  renderList(filtered(rows));
}

function bindUI(){
  document.getElementById('search').oninput = render;
  document.getElementById('sortBy').onchange = render;
  
  document.getElementById('typeSelect').onchange = (e) => {
    currentTab = e.target.value;
    render();
  };

  document.getElementById('statusSelect').onchange = (e) => {
    currentStatus = e.target.value;
    render();
  };
  
  const cfg = getNcConfig();
  if (cfg.url && cfg.user && cfg.pass) {
    const lastOk = localStorage.getItem('ncLastOk');
    setNcStatus('ok', lastOk ? `☁️ متصل به نکست‌کلاد (آخرین بکاپ: ${lastOk})` : '☁️ آماده اتصال به نکست‌کلاد');
  }

  document.getElementById('importFile').onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try {
        const d = JSON.parse(r.result);
        const rows = Array.isArray(d) ? d : (d.records || []);
        for(let x of rows) {
          if (x.issueDateEpochDay && !x.issueDate) x.issueDate = new Date(x.issueDateEpochDay * 86400000).toISOString().split('T')[0];
          if (x.dueDateEpochDay && !x.dueDate) x.dueDate = new Date(x.dueDateEpochDay * 86400000).toISOString().split('T')[0];
          if (x.type === 'installment' && x.scheduleCount > 1 && !x.instEachAmount) x.instEachAmount = Math.round(x.amount / x.scheduleCount);
          await saveRecord(x, true);
        }
        await render();
        closeModal();
        triggerAutoBackup();
        showToast('✅ با موفقیت بازیابی شد');
      } catch(err) {
        alert('فایل بک‌آپ خوانده نشد.');
      }
    }; 
    r.readAsText(f); 
    e.target.value='';
  };
}

document.addEventListener('deviceready', function() {
    document.addEventListener("backbutton", function (e) {
        const imageViewer = document.getElementById('imageViewerModal');
        const picker = document.getElementById('datePickerOverlay');
        const backdrop = document.getElementById('backdrop');

        if (imageViewer && imageViewer.classList.contains('show')) {
            imageViewer.classList.remove('show');
        } else if (picker) {
            picker.remove();
        } else if (backdrop && backdrop.classList.contains('show')) {
            closeModal();
        } else {
            navigator.app.exitApp();
        }
    }, false);

    if (window.plugins && window.plugins.Shortcuts) {
        const shortcuts = [
            {
                id: 'new_record',
                shortLabel: 'ثبت جدید',
                longLabel: 'ثبت فاکتور یا بدهی',
                intent: { action: 'android.intent.action.RUN', flags: 67108864, extras: { 'shortcut_action': 'new_record' } }
            },
            {
                id: 'search_record',
                shortLabel: 'جستجو',
                longLabel: 'جستجو در حساب‌ها',
                intent: { action: 'android.intent.action.RUN', flags: 67108864, extras: { 'shortcut_action': 'search_record' } }
            }
        ];

        window.plugins.Shortcuts.supportsDynamic(function(supported) {
            if (supported) window.plugins.Shortcuts.setDynamic(shortcuts, function(){}, function(){});
        });

        function handleShortcut(intent) {
            if (intent && intent.extras && intent.extras.shortcut_action) {
                setTimeout(() => {
                    if (intent.extras.shortcut_action === 'new_record') openForm();
                    else if (intent.extras.shortcut_action === 'search_record') document.getElementById('search').focus();
                }, 400);
            }
        }
        window.plugins.Shortcuts.getIntent(handleShortcut);
        window.plugins.Shortcuts.onNewIntent(handleShortcut);
    }
});

initDB().then(()=>{ bindUI(); render(); });
</script>
</body>
</html>
