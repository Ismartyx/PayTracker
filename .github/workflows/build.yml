name: Build Android APK

on:
  workflow_dispatch: 
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build APK
        run: |
          cordova create app com.kargah.finance "FinanceApp"
          rm -rf app/www/*
          cp index.html app/www/
          cp icon.png app/ || true
          sed -i 's|</widget>|    <icon src="icon.png" />\n</widget>|' app/config.xml
          cd app
          
          # نصب افزونه بومی برای دور زدن محدودیت‌های اشتراک‌گذاری اندروید
          cordova plugin add cordova-plugin-x-socialsharing
          
          cordova platform add android
          cordova build android
          
          find . -name "*.apk" -exec cp {} ../ \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceApp-APK
          path: "*.apk"
